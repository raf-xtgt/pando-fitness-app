<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A walk with Pando, replayed on the park.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pando">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pando replay</title>

  <!-- Link card for X, WhatsApp and others. tool/build_replay_web.py fills
       in the server's public address (an absolute image URL is required). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pando">
  <meta property="og:title" content="A walk with Pando">
  <meta property="og:description" content="Watch this walk, replayed on the park.">
  <meta property="og:image" content="__PANDO_PUBLIC_URL__/replay/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Pando mascot and the words: A walk, replayed on the park.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.json">
  <!-- Shown while Flutter starts (the replay page's first seconds); the same
       look as the app's ReplayLoading widget. Removed on Flutter's first
       frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F3EDE2; }
    #pando-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: Mulish, system-ui, sans-serif; font-size: 16px;
      color: #2A2622;
    }
    #pando-loading img {
      width: 120px; height: 120px;
      animation: pando-float 2.8s ease-in-out infinite;
    }
    @keyframes pando-float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #pando-loading img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="pando-loading" aria-live="polite">
    <img src="assets/assets/art/mascot/mascot_still.png" alt="">
    <div>Loading your walk…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('pando-loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
