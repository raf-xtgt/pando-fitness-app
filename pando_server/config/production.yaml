# This is the configuration file for your production environment.
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file is the examplepod.com domain name.

# Pando runs on Google Cloud Run with a Neon Postgres database.
# Secrets never live here or in the image: Cloud Run passes them as
# SERVERPOD_PASSWORD_<name> env vars from Secret Manager (see DEPLOYMENT.md).

# Configuration for the main API server. Cloud Run terminates https and
# forwards to port 8080. The public host is set with the
# SERVERPOD_API_SERVER_PUBLIC_HOST env var after the first deploy.
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server (not exposed on Cloud Run).
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 443
  publicScheme: https

# Neon Postgres (region paired with Cloud Run). Direct host, no pooler.
# The host comes from SERVERPOD_DATABASE_HOST and the password from
# SERVERPOD_DATABASE_PASSWORD (Secret Manager), so neither is in this
# public repo.
database:
  host: set-by-env-SERVERPOD_DATABASE_HOST
  port: 5432
  name: neondb
  user: neondb_owner
  requireSsl: true
  maxConnectionCount: 5

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  # Cloud Run collects stdout, so logs show in the Cloud Run console.
  consoleEnabled: true
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

#futureCall:
#  enabled: true # Defaults to true, set to false to disable scheduling and running future calls
#  executionEnabled: true # Defaults to true
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# Recommended when serving web clients: keeps auth tokens in httpOnly
# cookies. Without this, web tokens live in JavaScript-readable storage,
# where any XSS can steal them. Web clients opt in with
# `client.cookieAuth = true`. Requires `allowedOrigins`; browsers from
# origins not in the list lose cross-origin access, including to public
# endpoints.
#authCookie:
#  sameSite: lax # Defaults to "lax", options are "strict" or "none"
#  #name: serverpod_auth # Defaults to "serverpod_auth"
#  #refreshName: serverpod_auth_refresh # Defaults to "<name>_refresh"
#  #domain: examplepod.com # Defaults to host-only; set to share across subdomains
#  #path: / # Defaults to "/"
#  #secure: true # Defaults to true; the cookie is only sent over https
#allowedOrigins:
#  - https://app.examplepod.com # The origin serving your Flutter web app

# Pando: demo builds may seed three past walks (used for the demo video).
allowDemoSeed: true

# Pando: Google Cloud settings for the report alarm and push.
cloud:
  project: postulate-477006
  region: asia-southeast1
  alarmQueue: report-alarms
  maintenanceJob: pando-maintenance
  serviceAccount: pando-server@postulate-477006.iam.gserviceaccount.com
